<ion-header>
  <ion-toolbar color="primary">
    <ion-title>📦 Inventario</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-item *ngFor="let producto of productos">
      <ion-label>
        <h2>{{ producto.nombre }}</h2>
        <p>Stock: {{ producto.stock }} unidades</p>
      </ion-label>
      <ion-badge slot="end" [color]="producto.stock > 20 ? 'success' : 'danger'">
        {{ producto.stock > 20 ? 'Disponible' : 'Bajo Stock' }}
      </ion-badge>
    </ion-item>
  </ion-list>
</ion-content>
