<ion-header>
  <ion-toolbar color="primary">
    <ion-title>👥 Clientes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-searchbar placeholder="Buscar cliente..." animated></ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let cliente of clientes">
      <ion-avatar slot="start">
        <ion-icon name="person-circle-outline" style="font-size:40px;color:#1e3a8a"></ion-icon>
      </ion-avatar>
      <ion-label>
        <h2>{{ cliente.nombre }}</h2>
        <p>RUC: {{ cliente.ruc }}</p>
        <p>📞 {{ cliente.telefono }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
